      <rect x="-1.6" y="8" width="0.8" height="3" />
      <rect x="0.4" y="8" width="0.8" height="3" />
      <rect x="2.4" y="8" width="0.8" height="3" />
      <rect x="4.4" y="8" width="0.8" height="3" />
    </g>
  </g>
  <!-- SFP 光口（窄长方形） -->
  <g transform="translate(152, 119)">
    <circle cx="0" cy="-7" r="3" fill="#f59e0b" />
