<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 纯色背景 -->
  <rect width="256" height="256" fill="#e0f2fe" />

  <!-- 交换机主机身（灰色） -->
  <rect x="20" y="92" width="216" height="72" rx="10" fill="#868686" />

  <!-- 左侧：网络节点 -->
